<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹페이지</title>

    <style>
        /* CSS는 웹페이지의 '디자인'을 담당합니다. */
        
        /* 1. 웹페이지 전체(body) 디자인 */
        body {
            font-family: 'Malgun Gothic', sans-serif; /* 글꼴 설정 */
            background-color: #f0f4f8; /* 배경색 (아주 연한 파란색) */
            display: flex; /* 화면 가운데 정렬을 위한 설정 1 */
            justify-content: center; /* 화면 가운데 정렬을 위한 설정 2 */
            align-items: center; /* 화면 가운데 정렬을 위한 설정 3 */
            height: 100vh; /* 화면 높이를 100%로 꽉 채움 */
            margin: 0; /* 기본 여백 없애기 */
        }

        /* 2. 하얀색 프로필 카드 영역 디자인 */
        .profile-card {
            background-color: white; /* 카드 배경색은 흰색 */
            padding: 40px; /* 카드 안쪽 여백 */
            border-radius: 15px; /* 모서리를 둥글게 (15px 만큼) */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* 약간의 그림자 효과 */
            text-align: center; /* 글자를 가운데로 정렬 */
            max-width: 400px; /* 카드의 최대 너비 */
            width: 90%; /* 모바일 화면을 위해 너비를 90%로 유연하게 설정 */
        }

        /* 3. 프로필 이미지 디자인 */
        .profile-img {
            width: 150px; /* 이미지 너비 */
            height: 150px; /* 이미지 높이 */
            border-radius: 50%; /* 이미지를 완전한 동그라미로 만듦 */
            object-fit: cover; /* 이미지가 찌그러지지 않게 채움 */
            margin-bottom: 20px; /* 이미지 아래쪽 여백 */
        }

        /* 4. 버튼 디자인 */
        .hello-btn {
            background-color: #4CAF50; /* 버튼 색상 (초록색) */
            color: white; /* 버튼 글자색 */
            border: none; /* 버튼 테두리 없애기 */
            padding: 10px 20px; /* 버튼 안쪽 여백 (위아래 10px, 좌우 20px) */
            font-size: 16px; /* 버튼 글자 크기 */
            border-radius: 5px; /* 버튼 모서리 둥글게 */
            cursor: pointer; /* 마우스를 올렸을 때 손가락 모양으로 변경 */
            margin-top: 15px; /* 버튼 위쪽 여백 */
        }

        /* 버튼에 마우스를 올렸을 때(hover)의 디자인 변경 */
        .hello-btn:hover {
            background-color: #45a049; /* 마우스를 올리면 색상이 조금 더 진해짐 */
        }

        /* 숨겨진 환영 메시지의 텍스트 색상 */
        #welcome-message {
            color: #d32f2f; /* 진한 빨간색 */
            font-weight: bold; /* 글자를 굵게 */
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- HTML은 웹페이지의 '뼈대와 내용'을 담당합니다. -->

    <div class="profile-card">
        <!-- 프로필 이미지 자리 (placehold.co를 사용해 임시 이미지를 넣었습니다) -->
        <img src="https://placehold.co/150x150/e2e8f0/475569?text=Photo" alt="내 프로필 사진" class="profile-img">
        
        <!-- 이름 영역 (h1은 가장 큰 제목을 의미합니다) -->
        <h1>홍길동</h1>
        
        <!-- 소개 문구 영역 (p는 일반적인 문단을 의미합니다) -->
        <p>안녕하세요! 웹 개발을 처음 배우기 시작한 초보 개발자입니다. 코딩이 정말 재미있네요!</p>
        
        <!-- 클릭할 수 있는 버튼 -->
        <button id="myBtn" class="hello-btn">인사하기!</button>

        <!-- 자바스크립트로 띄울 메시지가 들어갈 빈 공간 -->
        <p id="welcome-message"></p>
    </div>

    <script>
        // JavaScript는 웹페이지의 '동작(이벤트)'을 담당합니다.

        // 1. HTML에서 'myBtn'이라는 아이디를 가진 버튼을 찾아서 btn이라는 변수에 저장합니다.
        const btn = document.getElementById('myBtn');
        
        // 2. HTML에서 'welcome-message'라는 아이디를 가진 p 태그를 찾아서 messageArea라는 변수에 저장합니다.
        const messageArea = document.getElementById('welcome-message');

        // 3. 버튼(btn)을 클릭(click)했을 때 실행될 명령(함수)을 설정합니다.
        btn.addEventListener('click', function() {
            // 버튼이 클릭되면, 비어있던 p 태그의 글자를 아래 문장으로 바꿉니다.
            messageArea.innerText = "제 홈페이지에 오신 것을 환영합니다! 🎉 만나서 반가워요!";
            
            // 클릭 후에는 버튼의 글자도 바꿔볼까요?
            btn.innerText = "인사 완료!";
            // 버튼의 배경색도 파란색으로 바꿔봅니다.
            btn.style.backgroundColor = "#2196F3"; 
        });
    </script>
</body>
</html>
